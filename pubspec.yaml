name: tv_browser
description: A D-pad friendly web browser for Android TV.
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.2
  speech_to_text: 7.0.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
